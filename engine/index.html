<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyEngine</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1f1a17; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; image-rendering: pixelated; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: #e9dfc9;
              font: 14px ui-monospace, Menlo, monospace; pointer-events: none; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="status">Loading…</div>
  <script type="module" src="main.js"></script>
</body>
</html>
